<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="paste">
  <meta name="theme-color" content="#F7F6F4">
  <title>paste - 常用資料快取</title>

  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- JsBarcode -->
  <script src="https://cdn.jsdelivr.net/npm/jsbarcode@3.11.5/dist/JsBarcode.all.min.js"></script>

  <style>
    /* iOS Safe Area & 溫暖高級淺底 */
    body {
      padding-top: env(safe-area-inset-top);
      padding-bottom: env(safe-area-inset-bottom);
      padding-left: env(safe-area-inset-left);
      padding-right: env(safe-area-inset-right);
      -webkit-tap-highlight-color: transparent;
      user-select: none;
      -webkit-user-select: none;
      background-color: #F7F6F4;
      color: #3C3642;
    }
    
    .selectable-text {
      user-select: text;
      -webkit-user-select: text;
    }

    .no-scrollbar::-webkit-scrollbar {
      display: none;
    }
    .no-scrollbar {
      -ms-overflow-style: none;
      scrollbar-width: none;
    }

    /* 大字模式階層 */
    body.large-font .content-text {
      font-size: 1.45rem !important;
      line-height: 1.5 !important;
      font-weight: 800 !important;
    }
    body.large-font .card-title {
      font-size: 1.15rem !important;
    }
    body.large-font .action-btn {
      padding: 0.65rem 1.1rem !important;
      font-size: 0.95rem !important;
    }

    /* 拖曳樣式 */
    .card-item.dragging {
      opacity: 0.45;
      transform: scale(0.98);
      box-shadow: 0 10px 25px -5px rgba(126, 107, 143, 0.15);
    }
    .card-item.drop-target-above {
      border-top: 3px solid #9D8BAE !important;
    }
    .card-item.drop-target-below {
      border-bottom: 3px solid #9D8BAE !important;
    }

    .drag-handle {
      touch-action: none;
    }
  </style>
</head>
<body class="min-h-screen flex flex-col font-sans transition-colors duration-200">

  <!-- Header -->
  <header class="sticky top-0 z-30 bg-[#F7F6F4]/90 backdrop-blur-md border-b border-[#E8E4EC] px-4 py-3.5">
    <div class="max-w-md mx-auto flex items-center justify-between">
      <div class="flex items-center space-x-2.5">
        <!-- 莫蘭迪紫 Logo 方塊 -->
        <div class="w-8 h-8 rounded-xl bg-[#8A769C] flex items-center justify-center text-white shadow-sm shadow-[#8A769C]/25">
          <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.2" d="M8 7v8a2 2 0 002 2h6M8 7V5a2 2 0 012-2h4.586a1 1 0 01.707.293l4.414 4.414a1 1 0 01.293.707V15a2 2 0 01-2 2h-2M8 7H6a2 2 0 00-2 2v10a2 2 0 002 2h8a2 2 0 002-2v-2" />
          </svg>
        </div>
        <div>
          <h1 class="text-xl font-bold tracking-tight text-[#3A3242] leading-none">paste</h1>
          <span class="text-[10px] text-[#A697B4] font-medium tracking-widest uppercase">Quick Clips</span>
        </div>
      </div>

      <div class="flex items-center space-x-2">
        <!-- 大字模式按鈕 -->
        <button id="toggleLargeFontBtn" onclick="toggleLargeFont()" class="flex items-center space-x-1.5 px-3 py-1.5 rounded-full text-xs font-semibold border border-[#E0D8E6] bg-white text-[#635770] shadow-sm active:scale-95 transition-all">
          <span class="text-xs font-bold text-[#8A769C]">Aa</span>
          <span id="fontStatusText">標準</span>
        </button>

        <!-- 新增卡片按鈕 -->
        <button onclick="openModal()" class="flex items-center space-x-1 px-3.5 py-1.5 rounded-full text-xs font-semibold bg-[#8A769C] text-white shadow-sm shadow-[#8A769C]/25 active:bg-[#786589] active:scale-95 transition-all">
          <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M12 4v16m8-8H4" />
          </svg>
          <span>新增</span>
        </button>
      </div>
    </div>
  </header>

  <!-- 主內容區 -->
  <main class="flex-1 max-w-md w-full mx-auto p-4 space-y-4">

    <!-- 搜尋框 & 類別篩選 -->
    <div class="space-y-3">
      <div class="relative">
        <input 
          type="text" 
          id="searchInput" 
          oninput="handleSearch()" 
          placeholder="搜尋標籤、帳號或文字..." 
          class="w-full pl-9 pr-8 py-2.5 bg-white border border-[#E8E4EC] rounded-2xl text-sm placeholder-[#B8B0C0] text-[#3A3242] focus:outline-none focus:ring-2 focus:ring-[#8A769C]/20 focus:border-[#8A769C] shadow-sm"
        />
        <svg class="w-4 h-4 text-[#A697B4] absolute left-3 top-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z" />
        </svg>
        <button id="clearSearchBtn" onclick="clearSearch()" class="hidden absolute right-3 top-3 text-[#A697B4] hover:text-[#786589]">
          <svg class="w-4 h-4" fill="currentColor" viewBox="0 0 20 20">
            <path fill-rule="evenodd" d="M10 18a8 8 0 100-16 8 8 0 000 16zM8.707 7.293a1 1 0 00-1.414 1.414L8.586 10l-1.293 1.293a1 1 0 101.414 1.414L10 11.414l1.293 1.293a1 1 0 001.414-1.414L11.414 10l1.293-1.293a1 1 0 00-1.414-1.414L10 8.586 8.707 7.293z" clip-rule="evenodd" />
          </svg>
        </button>
      </div>

      <!-- 類別橫列 -->
      <div class="flex items-center space-x-1.5 overflow-x-auto pb-1 no-scrollbar text-xs" id="categoryPillContainer">
        <!-- 動態渲染 -->
      </div>
    </div>

    <!-- 拖曳排序提示 -->
    <div id="reorderHint" class="text-[11px] text-[#A697B4] font-medium px-1 flex items-center justify-between">
      <span>長按並拖動右側「≡」可調整順序</span>
    </div>

    <!-- 卡片清單區 -->
    <div id="cardsContainer" class="space-y-3.5 pb-8">
      <!-- 動態渲染 -->
    </div>

    <!-- 空白提示 -->
    <div id="emptyState" class="hidden text-center py-14">
      <div class="w-12 h-12 mx-auto rounded-full bg-[#EFEBF2] flex items-center justify-center text-[#B8A7C6] mb-3">
        <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z" />
        </svg>
      </div>
      <p class="text-sm font-medium text-[#9E94A6]">找不到相符的常用資料</p>
    </div>

    <!-- 底部備份 -->
    <div class="border-t border-[#E8E4EC] pt-6 pb-12 text-center space-y-2">
      <div class="flex items-center justify-center space-x-3 text-xs text-[#786589]">
        <button onclick="exportData()" class="hover:text-[#4A3B59] underline font-medium">匯出 JSON 備份</button>
        <span>•</span>
        <label class="hover:text-[#4A3B59] underline font-medium cursor-pointer">
          <span>匯入備份</span>
          <input type="file" id="importFileInput" onchange="importData(event)" accept=".json" class="hidden">
        </label>
      </div>
      <p class="text-[11px] text-[#B8B0C0]">離線快取運作中・資料只留在此手機</p>
    </div>

  </main>

  <!-- 新增/編輯彈窗 -->
  <div id="cardModal" class="hidden fixed inset-0 z-50 flex items-end sm:items-center justify-center bg-[#2B2333]/30 backdrop-blur-sm p-0 sm:p-4">
    <div class="w-full max-w-md bg-white rounded-t-3xl sm:rounded-2xl p-6 shadow-2xl space-y-4 max-h-[90vh] overflow-y-auto border border-[#E8E4EC]">
      <div class="flex items-center justify-between">
        <h3 id="modalTitle" class="text-base font-bold text-[#3A3242]">新增常用資料</h3>
        <button onclick="closeModal()" class="w-8 h-8 rounded-full bg-[#F4F1F6] flex items-center justify-center text-[#8A769C] active:bg-[#EAE4F0]">
          <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12" />
          </svg>
        </button>
      </div>

      <form id="cardForm" onsubmit="saveCard(event)" class="space-y-4">
        <input type="hidden" id="cardId">
        
        <div>
          <label class="block text-xs font-semibold text-[#635770] mb-1">分類標籤</label>
          <select id="cardCategory" class="w-full px-3 py-2.5 bg-[#FAF9FB] border border-[#E8E4EC] rounded-xl text-sm font-medium text-[#3A3242] focus:outline-none focus:ring-2 focus:ring-[#8A769C]/30">
          </select>
        </div>

        <div>
          <label class="block text-xs font-semibold text-[#635770] mb-1">名稱 / 標題</label>
          <input type="text" id="cardTitleInput" required placeholder="如：富邦帳號、載具、地址" class="w-full px-3 py-2.5 bg-[#FAF9FB] border border-[#E8E4EC] rounded-xl text-sm font-medium text-[#3A3242] focus:outline-none focus:ring-2 focus:ring-[#8A769C]/30">
        </div>

        <div>
          <label class="block text-xs font-semibold text-[#635770] mb-1">常用內容（複製文字）</label>
          <textarea id="cardContentInput" required rows="3" placeholder="點擊按鈕時欲複製的純文字或數字..." class="w-full px-3 py-2.5 bg-[#FAF9FB] border border-[#E8E4EC] rounded-xl text-sm font-mono font-medium text-[#3A3242] focus:outline-none focus:ring-2 focus:ring-[#8A769C]/30"></textarea>
        </div>

        <div class="flex items-center space-x-2 pt-2">
          <button type="button" onclick="closeModal()" class="flex-1 py-3 text-sm font-semibold rounded-xl border border-[#E0D8E6] text-[#635770] bg-white active:bg-[#FAF9FB]">取消</button>
          <button type="submit" class="flex-1 py-3 text-sm font-semibold rounded-xl bg-[#8A769C] text-white shadow-sm shadow-[#8A769C]/25 active:bg-[#786589]">儲存卡片</button>
        </div>
      </form>
    </div>
  </div>

  <!-- 新增分類彈窗 -->
  <div id="addCategoryModal" class="hidden fixed inset-0 z-50 flex items-center justify-center bg-[#2B2333]/30 backdrop-blur-sm p-4">
    <div class="w-full max-w-xs bg-white rounded-2xl p-5 shadow-2xl space-y-4 text-center border border-[#E8E4EC]">
      <h3 class="text-sm font-bold text-[#3A3242]">新增自訂分類</h3>
      <input type="text" id="newCategoryInput" placeholder="如：公司、會員、備忘" maxlength="10" class="w-full px-3 py-2.5 bg-[#FAF9FB] border border-[#E8E4EC] rounded-xl text-sm text-center font-medium text-[#3A3242] focus:outline-none focus:ring-2 focus:ring-[#8A769C]/30">
      <div class="flex items-center space-x-2">
        <button type="button" onclick="closeAddCategoryModal()" class="flex-1 py-2 text-xs font-semibold rounded-lg border border-[#E0D8E6] text-[#635770]">取消</button>
        <button type="button" onclick="confirmAddCategory()" class="flex-1 py-2 text-xs font-semibold rounded-lg bg-[#8A769C] text-white">確定</button>
      </div>
    </div>
  </div>

  <!-- 條碼彈窗 -->
  <div id="barcodeModal" class="hidden fixed inset-0 z-50 flex items-center justify-center bg-[#2B2333]/50 backdrop-blur-sm p-4">
    <div class="w-full max-w-sm bg-white rounded-3xl p-6 shadow-2xl text-center space-y-4 border border-[#E8E4EC]">
      <div class="flex items-center justify-between pb-2 border-b border-[#F4F1F6]">
        <h4 id="barcodeModalTitle" class="font-bold text-[#3A3242]">出示條碼</h4>
        <button onclick="closeBarcodeModal()" class="w-8 h-8 rounded-full bg-[#F4F1F6] flex items-center justify-center text-[#8A769C] active:bg-[#EAE4F0]">
          <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12" />
          </svg>
        </button>
      </div>

      <div class="bg-white py-4 px-2 rounded-2xl border border-[#E8E4EC] flex flex-col items-center justify-center">
        <svg id="barcodeCanvas" class="max-w-full"></svg>
        <div id="barcodeCodeText" class="mt-2 text-lg font-mono font-bold tracking-widest text-[#3A3242]"></div>
      </div>

      <p class="text-xs text-[#9E94A6]">已設定高對比清晰度，可直接出示刷條碼</p>
      <button onclick="closeBarcodeModal()" class="w-full py-2.5 text-sm font-semibold rounded-xl bg-[#EFEBF2] text-[#635770] active:bg-[#E3DCF0]">完成關閉</button>
    </div>
  </div>

  <!-- Toast -->
  <div id="toast" class="fixed bottom-8 left-1/2 -translate-x-1/2 z-50 bg-[#3A3242]/95 backdrop-blur-md text-white text-xs font-medium px-4 py-2.5 rounded-full shadow-lg pointer-events-none transition-all duration-300 opacity-0 translate-y-3">
    提示
  </div>

  <script>
    const DEFAULT_CARDS = [
      {
        id: "1",
        category: "金融",
        title: "富邦銀行帳戶",
        content: "012-00650168128708"
      },
      {
        id: "2",
        category: "載具",
        title: "手機發票載具",
        content: "/55OVP3Q"
      },
      {
        id: "3",
        category: "地址",
        title: "常用收件地址",
        content: "100 台北市中正區重慶南路一段 122 號"
      }
    ];

    const DEFAULT_CATEGORIES = ["金融", "載具", "地址", "其他"];

    let cards = [];
    let categories = [];
    let currentCategory = "全部";
    let isLargeFont = false;

    // 拖曳狀態
    let draggedItem = null;
    let draggedIndex = null;
    let currentDropTarget = null;
    let dropPosition = null;

    document.addEventListener("DOMContentLoaded", () => {
      isLargeFont = localStorage.getItem("paste_large_font") === "true";
      applyLargeFont(isLargeFont);

      const savedCategories = localStorage.getItem("paste_categories");
      if (savedCategories) {
        try {
          categories = JSON.parse(savedCategories);
        } catch(e) {
          categories = [...DEFAULT_CATEGORIES];
        }
      } else {
        categories = [...DEFAULT_CATEGORIES];
        saveCategoriesToStorage();
      }

      const savedCards = localStorage.getItem("paste_cards");
      if (savedCards) {
        try {
          cards = JSON.parse(savedCards);
        } catch(e) {
          cards = [...DEFAULT_CARDS];
        }
      } else {
        cards = [...DEFAULT_CARDS];
        saveCardsToStorage();
      }

      renderCategoryPills();
      updateCategorySelectOptions();
      renderCards();
    });

    function saveCardsToStorage() {
      localStorage.setItem("paste_cards", JSON.stringify(cards));
    }

    function saveCategoriesToStorage() {
      localStorage.setItem("paste_categories", JSON.stringify(categories));
    }

    // 大字模式
    function toggleLargeFont() {
      isLargeFont = !isLargeFont;
      localStorage.setItem("paste_large_font", isLargeFont);
      applyLargeFont(isLargeFont);
      showToast(isLargeFont ? "已開啟大字模式" : "已切換回標準字體");
      triggerHaptic(25);
    }

    function applyLargeFont(active) {
      const body = document.body;
      const statusText = document.getElementById("fontStatusText");
      const btn = document.getElementById("toggleLargeFontBtn");

      if (active) {
        body.classList.add("large-font");
        statusText.innerText = "大字";
        btn.classList.add("bg-[#EFEBF2]", "border-[#B8A7C6]", "text-[#786589]");
      } else {
        body.classList.remove("large-font");
        statusText.innerText = "標準";
        btn.classList.remove("bg-[#EFEBF2]", "border-[#B8A7C6]", "text-[#786589]");
      }
    }

    // 類別膠囊欄
    function renderCategoryPills() {
      const container = document.getElementById("categoryPillContainer");
      const allCategories = ["全部", ...categories];

      let html = allCategories.map(cat => {
        const isActive = cat === currentCategory;
        const activeClass = isActive 
          ? "bg-[#8A769C] text-white font-semibold shadow-sm shadow-[#8A769C]/20" 
          : "bg-white text-[#635770] border border-[#E0D8E6] font-medium";
        return `<button onclick="setCategory('${cat}')" class="cat-pill px-3 py-1.5 rounded-full shrink-0 transition-colors ${activeClass}">${cat}</button>`;
      }).join("");

      html += `
        <button onclick="openAddCategoryModal()" class="px-2.5 py-1.5 rounded-full shrink-0 font-bold bg-[#EFEBF2] text-[#786589] hover:bg-[#E2DBEA] active:scale-95 transition-all flex items-center justify-center">
          <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M12 4v16m8-8H4" />
          </svg>
        </button>
      `;

      container.innerHTML = html;
    }

    function updateCategorySelectOptions() {
      const select = document.getElementById("cardCategory");
      select.innerHTML = categories.map(cat => `<option value="${cat}">${cat}</option>`).join("");
    }

    function setCategory(cat) {
      currentCategory = cat;
      renderCategoryPills();
      renderCards();

      const reorderHint = document.getElementById("reorderHint");
      if (currentCategory === "全部") {
        reorderHint.classList.remove("hidden");
      } else {
        reorderHint.classList.add("hidden");
      }
    }

    function openAddCategoryModal() {
      document.getElementById("newCategoryInput").value = "";
      document.getElementById("addCategoryModal").classList.remove("hidden");
      setTimeout(() => document.getElementById("newCategoryInput").focus(), 100);
    }

    function closeAddCategoryModal() {
      document.getElementById("addCategoryModal").classList.add("hidden");
    }

    function confirmAddCategory() {
      const input = document.getElementById("newCategoryInput");
      const val = input.value.trim();
      if (!val) return;
      if (categories.includes(val) || val === "全部") {
        showToast("該分類已存在");
        return;
      }

      categories.push(val);
      saveCategoriesToStorage();
      renderCategoryPills();
      updateCategorySelectOptions();
      closeAddCategoryModal();
      showToast(`已新增分類「${val}」`);
      triggerHaptic(20);
    }

    // 渲染卡片：莫蘭迪粉紫灰精靈感
    function renderCards() {
      const container = document.getElementById("cardsContainer");
      const emptyState = document.getElementById("emptyState");
      const query = document.getElementById("searchInput").value.trim().toLowerCase();

      let filtered = cards.filter(c => {
        const matchesCategory = currentCategory === "全部" || c.category === currentCategory;
        const matchesQuery = !query || 
          c.title.toLowerCase().includes(query) || 
          c.content.toLowerCase().includes(query);
        return matchesCategory && matchesQuery;
      });

      if (filtered.length === 0) {
        container.innerHTML = "";
        emptyState.classList.remove("hidden");
        return;
      }

      emptyState.classList.add("hidden");
      const isReorderEnabled = currentCategory === "全部" && query === "";

      container.innerHTML = filtered.map((card, index) => {
        const isBarcodeCompatible = card.category === "載具" || /^\/[A-Z0-9.+]{7}$/.test(card.content);
        return `
          <div 
            id="card-${card.id}" 
            data-id="${card.id}" 
            data-index="${index}" 
            class="card-item bg-white border border-[#E8E4EC] rounded-2xl p-4 shadow-[0_2px_8px_-2px_rgba(43,35,51,0.05)] relative space-y-2.5 transition-all duration-150"
          >
            <!-- 標題、標籤與操作 -->
            <div class="flex items-start justify-between gap-2">
              <div class="flex items-center space-x-2">
                <!-- 莫蘭迪灰紫質感標籤 -->
                <span class="px-2 py-0.5 rounded-md text-[11px] font-semibold bg-[#EFEBF2] text-[#786589] border border-[#E0D8E6]/70">
                  ${card.category}
                </span>
                <h3 class="card-title font-bold text-[#3A3242] text-sm tracking-tight leading-snug">
                  ${escapeHtml(card.title)}
                </h3>
              </div>

              <div class="flex items-center space-x-1.5">
                <!-- 複製按鈕 -->
                <button 
                  onclick="copyText('${card.id}', this)" 
                  class="action-btn flex items-center space-x-1 px-3 py-1.5 bg-[#EFEBF2] hover:bg-[#E2DBEA] text-[#786589] active:bg-[#8A769C] active:text-white rounded-xl text-xs font-bold transition-all shrink-0 active:scale-95"
                >
                  <svg class="w-3.5 h-3.5 copy-icon" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M8 5H6a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2v-1M8 5a2 2 0 002 2h2a2 2 0 002-2M8 5a2 2 0 012-2h2a2 2 0 012 2m0 0h2a2 2 0 012 2v3m2 4H10m0 0l3-3m-3 3l3 3" />
                  </svg>
                  <span class="copy-label">複製</span>
                </button>

                <!-- 拖曳排序手把 -->
                ${isReorderEnabled ? `
                  <div 
                    class="drag-handle p-1.5 text-[#B8A7C6] hover:text-[#786589] active:text-[#4A3B59] cursor-grab active:cursor-grabbing rounded-lg"
                    data-drag-id="${card.id}"
                  >
                    <svg class="w-4 h-4 pointer-events-none" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                      <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M4 8h16M4 16h16" />
                    </svg>
                  </div>
                ` : ''}
              </div>
            </div>

            <!-- 內容區（米灰暖調底色） -->
            <div 
              onclick="copyText('${card.id}', null)" 
              class="content-box bg-[#FAF9FB] hover:bg-[#F2EDF5] active:bg-[#EAE4F0] p-3 rounded-xl border border-[#EFEBF2] cursor-pointer transition-colors"
            >
              <div class="content-text selectable-text font-mono text-base font-semibold text-[#3A3242] break-all select-all leading-normal tracking-wide">
                ${escapeHtml(card.content)}
              </div>
            </div>

            <!-- 底部動作條 -->
            <div class="flex items-center justify-between pt-1 text-[#A697B4]">
              <div>
                ${isBarcodeCompatible ? `
                  <button onclick="openBarcodeModal('${escapeHtml(card.title)}', '${escapeHtml(card.content)}')" class="inline-flex items-center space-x-1 text-xs font-semibold text-[#786589] hover:text-[#3A3242] px-2.5 py-1 rounded-lg bg-[#EFEBF2] active:bg-[#E2DBEA]">
                    <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                      <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v1m6 11h2m-6 0h-2v4m0-11v3m0 0h.01M12 12h4.01M16 20h4M4 12h4m12 0h.01M5 8h2a1 1 0 001-1V5a1 1 0 00-1-1H5a1 1 0 00-1 1v2a1 1 0 001 1zm12 0h2a1 1 0 001-1V5a1 1 0 00-1-1h-2a1 1 0 00-1 1v2a1 1 0 001 1zM5 20h2a1 1 0 001-1v-2a1 1 0 00-1-1H5a1 1 0 00-1 1v2a1 1 0 001 1z" />
                    </svg>
                    <span>出示條碼</span>
                  </button>
                ` : ''}
              </div>

              <div class="flex items-center space-x-1">
                <button onclick="editCard('${card.id}')" class="p-1.5 hover:text-[#786589] active:scale-95" title="編輯">
                  <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M11 5H6a2 2 0 00-2 2v11a2 2 0 002 2h11a2 2 0 002-2v-5m-1.414-9.414a2 2 0 112.828 2.828L11.828 15H9v-2.828l8.586-8.586z" />
                  </svg>
                </button>
                <button onclick="deleteCard('${card.id}')" class="p-1.5 hover:text-[#BA7A8C] active:scale-95" title="刪除">
                  <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16" />
                  </svg>
                </button>
              </div>
            </div>
          </div>
        `;
      }).join("");

      if (isReorderEnabled) {
        attachTouchDragListeners();
      }
    }

    // 觸控拖曳排序
    function attachTouchDragListeners() {
      const handles = document.querySelectorAll(".drag-handle");
      handles.forEach(handle => {
        handle.addEventListener("touchstart", onDragTouchStart, { passive: false });
        handle.addEventListener("touchmove", onDragTouchMove, { passive: false });
        handle.addEventListener("touchend", onDragTouchEnd);
        handle.addEventListener("touchcancel", onDragTouchEnd);
      });
    }

    function onDragTouchStart(e) {
      const cardEl = e.currentTarget.closest(".card-item");
      if (!cardEl) return;
      draggedItem = cardEl;
      draggedIndex = parseInt(cardEl.dataset.index, 10);
      draggedItem.classList.add("dragging");
      triggerHaptic(30);
    }

    function onDragTouchMove(e) {
      if (!draggedItem) return;
      e.preventDefault();

      const touch = e.touches[0];
      const currentY = touch.clientY;

      const allCards = Array.from(document.querySelectorAll(".card-item:not(.dragging)"));
      clearDropIndicators();

      let target = null;
      let pos = null;

      for (let card of allCards) {
        const rect = card.getBoundingClientRect();
        if (currentY >= rect.top && currentY <= rect.bottom) {
          target = card;
          const midY = rect.top + rect.height / 2;
          pos = currentY < midY ? "above" : "below";
          break;
        }
      }

      currentDropTarget = target;
      dropPosition = pos;

      if (currentDropTarget && dropPosition) {
        currentDropTarget.classList.add(dropPosition === "above" ? "drop-target-above" : "drop-target-below");
      }
    }

    function onDragTouchEnd(e) {
      if (!draggedItem) return;

      if (currentDropTarget && dropPosition) {
        const fromIdx = draggedIndex;
        let toIdx = parseInt(currentDropTarget.dataset.index, 10);

        const movedItem = cards.splice(fromIdx, 1)[0];
        cards.splice(toIdx, 0, movedItem);

        saveCardsToStorage();
        triggerHaptic(20);
        showToast("已更新排序");
      }

      clearDropIndicators();
      draggedItem.classList.remove("dragging");
      draggedItem = null;
      draggedIndex = null;
      currentDropTarget = null;
      dropPosition = null;

      renderCards();
    }

    function clearDropIndicators() {
      document.querySelectorAll(".card-item").forEach(el => {
        el.classList.remove("drop-target-above", "drop-target-below");
      });
    }

    // 複製文字
    async function copyText(cardId, buttonElement) {
      const card = cards.find(c => c.id === cardId);
      if (!card) return;

      try {
        if (navigator.clipboard && window.isSecureContext) {
          await navigator.clipboard.writeText(card.content);
        } else {
          const textArea = document.createElement("textarea");
          textArea.value = card.content;
          textArea.style.position = "fixed";
          textArea.style.left = "-9999px";
          document.body.appendChild(textArea);
          textArea.focus();
          textArea.select();
          document.execCommand('copy');
          document.body.removeChild(textArea);
        }

        triggerHaptic(35);

        if (buttonElement) {
          const label = buttonElement.querySelector(".copy-label");
          const icon = buttonElement.querySelector(".copy-icon");
          const origLabel = label.innerText;
          
          buttonElement.classList.replace("bg-[#EFEBF2]", "bg-[#8A769C]");
          buttonElement.classList.replace("text-[#786589]", "text-white");
          label.innerText = "已複製！";
          icon.innerHTML = `<path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M5 13l4 4L19 7" />`;

          setTimeout(() => {
            buttonElement.classList.replace("bg-[#8A769C]", "bg-[#EFEBF2]");
            buttonElement.classList.replace("text-white", "text-[#786589]");
            label.innerText = origLabel;
            icon.innerHTML = `<path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M8 5H6a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2v-1M8 5a2 2 0 002 2h2a2 2 0 002-2M8 5a2 2 0 012-2h2a2 2 0 012 2m0 0h2a2 2 0 012 2v3m2 4H10m0 0l3-3m-3 3l3 3" />`;
          }, 1400);
        } else {
          showToast(`已複製：${card.title}`);
        }

      } catch (err) {
        showToast("請手動長按文字複製");
      }
    }

    function handleSearch() {
      const query = document.getElementById("searchInput").value;
      const clearBtn = document.getElementById("clearSearchBtn");
      if (query.length > 0) {
        clearBtn.classList.remove("hidden");
      } else {
        clearBtn.classList.add("hidden");
      }
      renderCards();
    }

    function clearSearch() {
      document.getElementById("searchInput").value = "";
      document.getElementById("clearSearchBtn").classList.add("hidden");
      renderCards();
    }

    function openModal(editId = null) {
      const modal = document.getElementById("cardModal");
      const title = document.getElementById("modalTitle");
      const form = document.getElementById("cardForm");

      form.reset();
      document.getElementById("cardId").value = "";

      if (editId) {
        const item = cards.find(c => c.id === editId);
        if (item) {
          title.innerText = "編輯資料";
          document.getElementById("cardId").value = item.id;
          document.getElementById("cardCategory").value = item.category;
          document.getElementById("cardTitleInput").value = item.title;
          document.getElementById("cardContentInput").value = item.content;
        }
      } else {
        title.innerText = "新增常用資料";
      }

      modal.classList.remove("hidden");
    }

    function closeModal() {
      document.getElementById("cardModal").classList.add("hidden");
    }

    function saveCard(e) {
      e.preventDefault();
      const id = document.getElementById("cardId").value;
      const category = document.getElementById("cardCategory").value;
      const title = document.getElementById("cardTitleInput").value.trim();
      const content = document.getElementById("cardContentInput").value.trim();

      if (!title || !content) return;

      if (id) {
        const index = cards.findIndex(c => c.id === id);
        if (index !== -1) {
          cards[index] = { ...cards[index], category, title, content };
        }
        showToast("已更新項目");
      } else {
        const newCard = {
          id: Date.now().toString(),
          category,
          title,
          content
        };
        cards.unshift(newCard);
        showToast("已新增項目");
      }

      saveCardsToStorage();
      renderCards();
      closeModal();
      triggerHaptic(20);
    }

    function editCard(id) {
      openModal(id);
    }

    function deleteCard(id) {
      const item = cards.find(c => c.id === id);
      if (!item) return;
      if (confirm(`確定要刪除「${item.title}」嗎？`)) {
        cards = cards.filter(c => c.id !== id);
        saveCardsToStorage();
        renderCards();
        showToast("已刪除項目");
        triggerHaptic(20);
      }
    }

    function openBarcodeModal(title, text) {
      document.getElementById("barcodeModalTitle").innerText = title;
      document.getElementById("barcodeCodeText").innerText = text;
      
      try {
        JsBarcode("#barcodeCanvas", text, {
          format: "CODE39",
          lineColor: "#2B2333",
          width: 2.2,
          height: 80,
          displayValue: false
        });
      } catch (e) {
        JsBarcode("#barcodeCanvas", text, {
          format: "CODE128",
          lineColor: "#2B2333",
          width: 2.2,
          height: 80,
          displayValue: false
        });
      }

      document.getElementById("barcodeModal").classList.remove("hidden");
    }

    function closeBarcodeModal() {
      document.getElementById("barcodeModal").classList.add("hidden");
    }

    function exportData() {
      const backupData = {
        cards,
        categories,
        exportedAt: new Date().toISOString()
      };
      const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(backupData, null, 2));
      const downloadAnchor = document.createElement("a");
      downloadAnchor.setAttribute("href", dataStr);
      downloadAnchor.setAttribute("download", `paste_backup_${new Date().toISOString().slice(0,10)}.json`);
      document.body.appendChild(downloadAnchor);
      downloadAnchor.click();
      downloadAnchor.remove();
      showToast("已匯出備份檔案");
    }

    function importData(event) {
      const file = event.target.files[0];
      if (!file) return;

      const reader = new FileReader();
      reader.onload = function(e) {
        try {
          const imported = JSON.parse(e.target.result);
          if (Array.isArray(imported)) {
            cards = imported;
          } else if (imported.cards && Array.isArray(imported.cards)) {
            cards = imported.cards;
            if (Array.isArray(imported.categories)) {
              categories = imported.categories;
              saveCategoriesToStorage();
              renderCategoryPills();
              updateCategorySelectOptions();
            }
          }
          saveCardsToStorage();
          renderCards();
          showToast("備份匯入成功！");
        } catch(err) {
          showToast("檔案格式錯誤");
        }
      };
      reader.readAsText(file);
      event.target.value = "";
    }

    function triggerHaptic(duration = 20) {
      if (navigator.vibrate) {
        try {
          navigator.vibrate(duration);
        } catch(e) {}
      }
    }

    let toastTimeout;
    function showToast(msg) {
      const toast = document.getElementById("toast");
      toast.innerText = msg;
      toast.classList.remove("opacity-0", "translate-y-3");
      toast.classList.add("opacity-100", "translate-y-0");
      clearTimeout(toastTimeout);
      toastTimeout = setTimeout(() => {
        toast.classList.remove("opacity-100", "translate-y-0");
        toast.classList.add("opacity-0", "translate-y-3");
      }, 1600);
    }

    function escapeHtml(str) {
      return String(str)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
    }
  </script>
</body>
</html>
